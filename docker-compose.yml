services:
  emoskata:
    build: .
    container_name: emoskata
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      EMOS_ENV_FILE: /app/config/.env
    volumes:
      - ./config:/app/config
      - ./data:/app/runtime/data
      - ./runtime:/app/runtime
    command: ["python3", "/app/runtime/emoskata.py"]
    stop_grace_period: 120s
