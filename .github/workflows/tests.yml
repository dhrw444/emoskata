name: Python regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile real inline web scripts
        run: python -B check_web_js.py
      - name: Fail if the single-file entry is stale
        # Docker 只拷 emoskata.py；磁盘模块改了没重建，镜像跑的就是旧代码。
        run: python -B build_single.py --check
      - name: Run standard-library test suite
        run: python -B -m unittest discover -v
      - name: Validate installer syntax
        run: |
          sh -n install.sh
          sh -n prepare_docker.sh
